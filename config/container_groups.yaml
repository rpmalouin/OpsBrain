# OpsBrain dashboard container group filters.
# Maps a group label -> list of name substrings (case-insensitive). A container
# belongs to a group if ANY substring matches its name. "misc" is auto-assigned
# to containers that match no group. The "all" pseudo-group shows everything.
#
# This file is read by the dashboard frontend into the groups object.

media:
  - plex
  - tautulli
  - youtube-dl
  - grimmory      # restored 2026-11-22 (book library, MariaDB-backed)

ai:
  # ollama + open-webui were retired on dockerVM 2026-11-13; the LLM now lives on the ollama box
  # (10.1.10.30) and is not a container here.
  - hermes
  - hindsight
  - qwen

infra:
  - caddy
  # restored 2026-11-22 with the monitor pair (netdata + dozzle). dockpeek stays out: it was
  # retired 2026-11-13 and did not come back.
  - netdata
  - dozzle
  - dockhand
  - homepage
  - firefox
  - gluetun

databases:
  - mariadb
  - postgres
  - postgresql
  - redis
  - immich
  - valkey

misc: []