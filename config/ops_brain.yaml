# Ops Brain - central configuration
# Runtime reads this file with PyYAML (python3 -c "import yaml").
# Paths are relative to the repo root unless absolute.

# --- Identity ---
hostname: dockerVM               # used in reports/notifications
interval_seconds: 120            # scheduler poll cadence (2 minutes)

# --- Inference (Ollama local) ---
ollama:
  url: http://localhost:11434/api/generate
  model: qwen3:14b                # requested model (Qwen3 14B)
  fallback_model: qwen2.5-coder:14b   # used if primary unavailable
  timeout: 120
  think: true                  # Qwen3 thinking mode; MUST be explicit (default path returns {} in this ollama)
  options:                     # passed verbatim to Ollama /api/generate options
    temperature: 0.2
    num_ctx: 32768
    keep_alive: 5m

# --- Data sources ---
sources:
  netdata:
    base_url: http://localhost:19999
    enabled: true
  dozzle:
    base_url: http://localhost:8080
    enabled: true
  dockpeek:
    base_url: http://localhost:8081
    enabled: true
  docker_socket: /var/run/docker.sock     # primary container-state source
  gpu_query: whitelisted                  # nvidia-smi interprets the query below
  journalctl_since: "2 min ago"

# --- Action engine ---
actions:
  dry_run: true                 # SAFETY: set false to actually execute remediation
  restart_limit_per_run: 3      # cap docker/systemctl restarts per cycle
  cpu_restart_threshold_percent: 80.0
  cpu_restart_minutes: 5        # sustained CPU needed before restart
  mem_creep_threshold_percent: 20.0   # memory growth vs baseline
  gpu_mem_threshold_percent: 90.0
  disk_threshold_percent: 85.0
  qwen_confidence_floor: 0.6    # below this -> do nothing and log
  # Containers the engine may restart (case-insensitive match against docker name).
  # Empty = allow all. dockpeek + last30days-runner reflect the real docker names.
  allow_restart_containers:
    - homepage
    - dozzle
    - dockpeek
    - netdata
    - caddy
    - caddy-editor
    - calibre
    - calibre-web
    - dockscope
    - filerise
    - firefox
    - flacsentry
    - grimmory
    - homelab-hub
    - homepage-editor
    - last30days-runner
    - librewolf
    - yamtrack
    - youtube-dl-server
  allow_service_restart: []     # systemd units whitelist (shell injection safe)
  allow_gpu_kill: false
  allow_prune: true
  manual_stop_sigkill_protect: true   # treat exit 137 (no OOM) as a manual stop
  notify_webhook: ""            # optional generic webhook (POST JSON), e.g. ntfy/Telegram bot

# --- Manual Stop Protection (HARD INVARIANT) ---
# "Manually stopped containers must stay stopped." OpsBrain must NEVER restart
# (or destroy via prune) a container the user manually stopped — regardless of
# autonomous remediation, confidence gating, restart caps, anomaly detection,
# drift remediation, daily report recommendations, or any Qwen-generated action.
manual_stop_protection:
  enabled: true
  track_manual_stops: true
  block_restart_for_manual_stops: true

# --- GPU drift detection ---
gpu_drift:
  enabled: true
  vram_creep_mb: 250           # VRAM increase between cycles that flags vram_drift
  vram_max_percent: 90         # VRAM usage % of total that flags vram_overload
  stuck_pid_cycles: 5          # same GPU PID cycled this many times + util>util_thr -> stuck_process
  util_threshold: 10            # GPU util % treated as "idle" for power/temp drift; stuck needs util>this
  power_idle_max_watts: 40      # power draw above this while util<thr -> power_drift
  temp_idle_max_c: 55           # temp above this while util<thr -> temp_drift

# --- Daily report ---
report:
  time: "23:55"
  dir: reports
  retention_days: 30

# --- Paths (defaults to repo layout) ---
paths:
  repo: /appdata/OpsBrain
  collector_json: logs/collector.json
  reasoner_json: logs/reasoner_result.json
  actions_json: logs/actions_result.json
  baseline_json: logs/baseline.json
  gpu_baseline: logs/gpu_baseline.json
  gpu_drift_events: logs/gpu_drift_events.jsonl
  gpu_daily_stats: logs/gpu_daily_stats.json
  manual_stops: logs/manual_stops.json
  prev_running: logs/prev_running.json

logging:
  log_dir: logs
  file: logs/opsbrain.log