# Ops Brain - central configuration
# Runtime reads this file with PyYAML (python3 -c "import yaml").
# Paths are relative to the repo root unless absolute.

# --- Identity ---
hostname: dockerVM               # used in reports/notifications
interval_seconds: 3600           # scheduler poll cadence (1 hour — homelab-tuned 2026-09)

# --- Inference (Ollama local) ---
ollama:
  url: http://localhost:11434/api/generate
  model: qwen2.5-7b-128k:latest    # the host's only LLM since 2026-10-20 (7.6B Q4_K_M, tag
                                  # num_ctx 131072, non-thinking; 8.8 GB at 100% GPU). 65k ->
                                  # 128k so the request window matches what Hermes-Mac needs;
                                  # every consumer names this same tag (no model swaps).
  # fallback_model / alt_models deliberately removed 2026-10-16: with a single installed LLM a
  # fallback can only name a model that no longer exists. The probe below stays and the stage
  # still fails loudly (rc=3) rather than reasoning with something nobody chose.
  # ONLY models named above are ever used. The reasoner probes /api/tags (is the model
  # installed) and /api/show (does it declare the "thinking" capability) and then sends
  # `think` per model — required for thinking models here, HTTP 400 for the others.
  # If none of these are installed the stage fails loudly (rc=3) instead of silently
  # reasoning with an unconfigured model.
  timeout: 120
  think: true                  # ALLOW flag only: the reasoner probes /api/show and sends `think`
                               # per model (qwen2.5-7b-128k declares completion+tools, no thinking,
                               # so no `think` field is sent). Explicit because the default path
                               # returns {} in this ollama for thinking models.
  options:                     # passed verbatim to Ollama /api/generate options
    temperature: 0.2
    # 2026-10-22 (dual-GPU work): 32768 -> 131072. The reason the old cap existed (this
    # 16 GB card could not hold model+KV at 40960) is gone: the host now has TWO cards
    # (5070 Ti 16 GB + 3060 12 GB, 27.1 GiB pool) and the 7B at 131072 measures 8.8 GB,
    # 100% GPU, 153 tok/s. More importantly, EVERY other consumer (paperless-ngx, hindsight,
    # paperless-gpt, open-webui) calls at 131072, and a different num_ctx re-sizes the
    # runner: ollama unloads and reloads the model for this one hourly call, then reloads
    # again at 128k for the next consumer. Matching the window removes that churn.
    # The digest is only ~7.4k chars (~2.5k tokens), so 131072 is pure headroom here.
    num_ctx: 131072
    keep_alive: 5m

# --- Data sources ---
sources:
  netdata:
    base_url: http://localhost:19999
    enabled: true
  dozzle:
    base_url: http://localhost:8081
    enabled: true
  dockpeek:
    base_url: http://localhost:8001
    enabled: true
  truenas:
    # JSON-RPC 2.0 over WebSocket — the supported API. Do NOT go back to REST:
    # TrueNAS 25.10 deprecates /api/v2.0 (removed in 26.04) and raises the
    # RESTAPIUsage warning for every Basic-auth request (4 per poll here).
    transport: jsonrpc
    ws_url: wss://truenas/api/current      # self-signed cert; verification is off client-side
    creds_file: ~/.smbcred     # username= / password= lines (auth.login_ex PASSWORD_PLAIN)
    enabled: true
    timeout_s: 8
    # legacy, only if transport is switched back to "rest":
    # base_url: http://truenas/api/v2.0
  dockhand:
    enabled: true
    db_path: /appdata/dockhand/sqlite/db/dockhand.db   # dockerVM's Dockhand SQLite (WAL, read-only)
    compose_root: /appdata/A--docker_stacks            # host prefix mapped from /app/data/stacks in compose_path
    environment_id: 1                                  # 1 = DockerVM (local desired-state)
    storm_min_events: 3                                # die/destroy/restart in window -> restart storm
    storm_window_s: 1800
    flap_min_transitions: 2                            # healthy<->unhealthy toggles -> health flap
    image_drift_skip_local_builds: true                # services with `build:` are built HERE: a rebuilt tag (docker reports the bare image id) is churn, not drift
  vault_drift:
    enabled: true
    report_path: /appdata/OpsBrain/logs/vault_drift_report.json  # produced by the Hermes vault-drift cron
    max_age_s: 691200                                   # ~8 days (weekly cron) before marking stale
  gpu_reconcile:
    enabled: true
    log_path: /var/log/nvidia-module-reconcile.log      # written by the driver-reconcile apt hook
    module_version_file: /sys/module/nvidia/version     # the LOADED module
    ko_root: /lib/modules                               # on-disk module: <ko_root>/<uname -r>/**/nvidia.ko*
    max_age_s: 604800                                   # 7 days: older hook events are history, not news
  docker_socket: /var/run/docker.sock     # primary container-state source
  gpu_query: whitelisted                  # nvidia-smi interprets the query below
  journalctl_since: "60 min ago"   # must cover the inter-cycle gap (3600s cadence)

# --- Action engine ---
actions:
  dry_run: false                # LIVE: remediation now executes (gated by allow-list/cap)
  restart_limit_per_run: 3      # cap docker/systemctl restarts per cycle
  cpu_restart_threshold_percent: 80.0
  cpu_restart_minutes: 120      # sustained CPU needed before restart (>=2 hourly samples at 3600s cadence; single-sample restart guard)
  mem_creep_threshold_percent: 20.0   # memory growth vs baseline
  gpu_mem_threshold_percent: 90.0
  disk_threshold_percent: 85.0
  qwen_confidence_floor: 0.6    # below this -> do nothing and log
  # Containers the engine may restart (case-insensitive match against docker name).
  # Empty = allow all. dockpeek + last30days-runner reflect the real docker names.
  allow_restart_containers:
    - homepage
    - dozzle
    - dockpeek
    - netdata
    - caddy
    - filerise
    # GUI/VNC browsers are NOT auto-restarted: they are interactive and a
    # restart destroys the in-use session; docker restart policy covers crashes.
    # (Removed 2026-09: qwen restarted Firefox on high CPU + storm flags every
    # cycle — each restart re-armed the storm detector.)
    - flacsentry
    - grimmory
    - homelab-hub
    - homepage-editor
    - last30days-runner
    - yamtrack
    - youtube-dl-server
  allow_service_restart: []     # systemd units whitelist (shell injection safe)
  allow_gpu_kill: false
  allow_prune: false               # BRAKE 2026-10-27: the reasoner proposed docker_prune off an
                                   # orphan notice and the engine ran `docker system prune -af`
                                   # (whole host: stopped containers, unused images, build cache).
                                   # The verb now also needs the disk-threshold rule's evidence
                                   # (blocked_no_prune_evidence); re-enable only with that gate live.
  manual_stop_sigkill_protect: true   # treat exit 137 (no OOM) as a manual stop
  notify_webhook: ""            # optional generic webhook (POST JSON), e.g. ntfy/Telegram bot

# --- Federation (multi-node) ---
federation:
  enabled: true
  nodes:
    # Each node's collector_endpoint serves what THIS host serves: its OpsBrain dashboard
    # `/api/status` envelope (or a raw collector.json). It is the dashboard port, NOT an
    # arbitrary one — 8099 on dockerVM is caddy-editor (404) which made the cluster read red.
    - name: dockervm
      type: linux
      collector_endpoint: "http://127.0.0.1:9120/api/status"
    # Mac Studio (Mac17,14 / macOS 27) — a SNAPSHOT-SOURCED node (`kind: snapshot`): it has no
    # endpoint and nothing here polls it. Its own 15-minute cron producer writes the file below into
    # the SMB share, and for this node that FILE IS THE NODE: it decides online/offline and supplies the
    # telemetry (Time Machine's last backup, mount health, Hermes cron health, the loopback-only
    # services, per-volume disks, and the macmon `soc` block). OpsBrain is the CONSUMER only — never
    # write it from here. See federation/local_snapshot.py for the states (ok / stale / dead / missing).
    #
    # Why no endpoint: our federation poll runs every 2 h (poll_interval_cycles x interval_seconds)
    # while the producer ticks every 15 min, so a scrape would sample a finer source more coarsely. It
    # also deletes a failure mode: this node used to poll the Mac's Netdata at 10.1.10.34:19999 and
    # reported a standing critical whenever the DHCP lease, the bind or the agent moved. Netdata was
    # removed from the Mac on 2026-10-12 and its alarm path retired with it — measured, that path
    # contributed ZERO kept alarms to this node, so nothing was migrated out of it.
    - name: macstudio
      type: macos
      kind: snapshot
      snapshot_file: "logs/macstudio_node.json"
      snapshot_max_age_s: 2700        # soft: 3 missed ticks -> one anomaly, the node stays ONLINE
      snapshot_dead_after_s: 7200     # hard: 8 missed ticks -> the node reads OFFLINE (critical)
      snapshot_tm_stale_hours: 48     # a Time Machine backup older than this is said out loud
      snapshot_gateway_stale_s: 300   # the Mac's Hermes gateway heartbeat is ~15 s old when healthy
      # The Netdata-era keys are gone (volumes, alarm_keep, alarm_skip_names, alarm_skip_mounts and its
      # 21 paths): the per-volume list now derives from the producer's `disks[]` (the same six paths,
      # with total/used/free instead of a lone percentage), and the alarms themselves were the Mac's
      # Netdata verdicts, which no longer exist. This node's findings are its producer's own `alerts[]`
      # plus this collector's derived checks (memory pressure, a stopped fan, a read-only or unmounted
      # share, the gateway heartbeat) — see federation/local_snapshot.py.
    # truenas: disabled 2026-10-10 — nothing on that box serves /api/status (http://truenas:8099
    # was a guess: connection refused), so it only produced a permanent critical
    # "1 node(s) offline" rec every federation cycle. Re-enable once an OpsBrain dashboard
    # answers there (per-node OpsBrain on :9120, published/served to this host).
    # - name: truenas
    #   type: storage
    #   collector_endpoint: "http://truenas:9120/api/status"
  cluster_stability_weights:
    confidence: 0.4
    drift: 0.3
    anomalies: 0.2
    restarts: 0.1
  poll_interval_cycles: 2        # run federation every N scheduler cycles (2 h at 3600s)

# --- Manual Stop Protection (HARD INVARIANT) ---
# "Manually stopped containers must stay stopped." OpsBrain must NEVER restart
# (or destroy via prune) a container the user manually stopped — regardless of
# autonomous remediation, confidence gating, restart caps, anomaly detection,
# drift remediation, daily report recommendations, or any Qwen-generated action.
manual_stop_protection:
  enabled: true
  track_manual_stops: true
  block_restart_for_manual_stops: true

# --- GPU drift detection ---
gpu_drift:
  enabled: true
  vram_creep_mb: 250           # VRAM increase between cycles that flags vram_drift
  vram_max_percent: 90         # VRAM usage % of total that flags vram_overload
  stuck_pid_cycles: 2          # same GPU PID cycled this many times + util>util_thr -> stuck_process (~2 h at 3600s cadence)
  util_threshold: 10            # GPU util % treated as "idle" for power/temp drift; stuck needs util>this
  # Permanent GPU residents: containers whose GPU process is a MODEL SERVER that holds
  # VRAM forever and idles at 0% util between jobs (docling-serve loads its layout/table
  # models on cuda:0 at boot). Never stuck candidates — same treatment as ollama's
  # llama-server. Matched by the container's own PID (State.Pid), because nvidia-smi
  # reports the compute app as the interpreter path (`/opt/app-root/bin/python3`), so no
  # name marker can identify it. Entries must name a real container.
  resident_containers: [docling-serve]
  power_idle_max_watts: 60      # power draw above this while util<thr -> power_drift.
                                # Was 40: measured 2026-10-27, this card idles at ~9 W empty
                                # but draws 40-44 W whenever a model sits loaded and the sample
                                # catches it idle (43.68 W at 0 % util), so 40 alerted on normal
                                # residency. Real load is 200-276 W, far above 60.
  temp_idle_max_c: 55           # temp above this while util<thr -> temp_drift

# --- Daily report ---
report:
  # Report for date D fires at the first cycle on/after D's report time; the due
  # window extends past midnight to the same time on D+1 so coarse cadences
  # (e.g. hourly polls straddling 23:55) still generate it daily.
  time: "23:55"
  dir: reports
  retention_days: 30

# --- Paths (defaults to repo layout) ---
paths:
  repo: /appdata/OpsBrain
  collector_json: logs/collector.json
  reasoner_json: logs/reasoner_result.json
  actions_json: logs/actions_result.json
  baseline_json: logs/baseline.json
  gpu_baseline: logs/gpu_baseline.json
  gpu_drift_events: logs/gpu_drift_events.jsonl
  gpu_daily_stats: logs/gpu_daily_stats.json
  manual_stops: logs/manual_stops.json
  prev_running: logs/prev_running.json
  cluster_snapshot: logs/cluster_snapshot.json
  cluster_reasoner: logs/cluster_reasoner_result.json

logging:
  log_dir: logs
  file: logs/opsbrain.log